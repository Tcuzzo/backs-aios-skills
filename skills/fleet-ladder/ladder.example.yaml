# Fleet ladder — EXAMPLE. Copy beside your code (e.g. ladder.yaml) and swap
# every placeholder for a model your providers actually serve.
# Per role: ordered candidates, strongest first, ending in a local survival
# tail (whatever runs on your own hardware when every cloud provider is dark).
# To change or add a model, edit THIS file — never the code.

builder:                        # implements and repairs
  - strong-cloud-model          # best quality; first choice when it is up
  - mid-cloud-model             # solid and cheaper; the usual fallback
  - local-coder-model           # survival tail: your own hardware

grader:                         # independent review — the authoring execution that built is disqualified; same model, rung, or family in a fresh, author-disjoint session is permitted
  - independent-strong-model    # a SEPARATE execution from the builder rungs
  - independent-mid-model
  - local-review-model

worker:                         # bounded, well-specified jobs; cheap rungs fine
  - fast-cheap-model
  - local-small-model

# --- Solo variant: only one configured execution available ---------------
# Builder and grader must run in DIFFERENT executions (the authoring execution
# that built cannot approve its own work). Split within the same family when
# you have to, and say so in the dispatch log — it is the weakest legal
# separation, not the ideal.
#
# builder:
#   - family-large-model
# grader:
#   - family-small-model        # different execution in the same family — log it
# worker:
#   - family-small-model